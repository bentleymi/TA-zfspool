[script://$SPLUNK_HOME/etc/apps/TA-zfspool/bin/zfspool_events.py]
interval = 300
index = main
sourcetype = zfspool:status
source = status
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-zfspool/bin/zfspool_metrics.py]
interval = 300
index = metrics
sourcetype = zfspool:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-zfspool/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-zfspool
disabled = 0
python.version = python3
python.required = 3.13
