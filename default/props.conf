[zfspool:status]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 400000

[zfspool:metrics]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
DATETIME_CONFIG = CURRENT
TRUNCATE = 400000
TRANSFORMS-zfspool-metrics = zfspool_metric_name
METRIC-SCHEMA-TRANSFORMS = metric-schema:zfspool

[ta_license:status]
KV_MODE = json
NO_BINARY_CHECK = true
TRUNCATE = 20000
